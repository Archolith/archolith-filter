[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archolith-filter"
version = "0.1.0"
description = "Token Reduction Toolkit — deterministic output filtering for LLM agent contexts"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Charles Harvey", email = "ctharvey@me.com" }]
keywords = ["llm", "token-reduction", "output-filtering", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    # Note: License :: classifiers are deprecated under PEP 639. The
    # `license = "Apache-2.0"` SPDX expression above is the canonical
    # declaration.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "archolith-maintenance>=0.1.0",
]

[project.urls]
Repository = "https://github.com/Archolith/archolith-filter"
Issues = "https://github.com/Archolith/archolith-filter/issues"

[project.optional-dependencies]
tokenizer = ["tiktoken>=0.7"]
context = ["archolith-proxy>=0.1.0"]
extractors = ["httpx>=0.27"]
# pytest-asyncio is required, not optional: the extractor tests use
# @pytest.mark.asyncio, and without the plugin 12 of them fail with "async def
# functions are not natively supported" on a clean `pip install -e .[dev]`.
dev = ["httpx>=0.27", "pytest>=8", "pytest-asyncio>=0.23", "pytest-benchmark>=5", "pytest-cov>=5", "ruff>=0.5"]

[project.entry-points."archolith.tool_extractors"]
bash_filter = "archolith_filter.extractors.bash:BashFilterExtractor"
read_file_filter = "archolith_filter.extractors.read_file:ReadFileFilterExtractor"

[tool.hatch.build.targets.wheel]
packages = ["archolith_filter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
